name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sitemap.txt'
      - 'assets/**'
      - 'indexnow-key.txt'
      - 'scripts/notify_indexnow.py'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate sitemap and wait for current Pages content
        run: python3 scripts/notify_indexnow.py
